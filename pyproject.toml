[project]
name = "micro-queue"
version = "0.1.0"
description = "GPU job scheduler: FastAPI API, Celery workers (one per GPU), Redis for queues and shared state"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "celery[redis]>=5.4.0",
    "fastapi[standard]>=0.115.6",
    "httpx>=0.28.1",
    "pydantic>=2.10.3",
    "pydantic-settings>=2.7.0",
    "redis>=5.2.1",
    "uvicorn>=0.34.0",
]

[project.optional-dependencies]
torch = [
    "torch>=2.15.0",
]

[dependency-groups]
dev = [
    "celery-types>=0.22.0",
    "fakeredis>=2.40.0",
    "mypy>=1.13.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
    "types-colorama>=0.4.15.20240311",
    "types-pygments>=2.18.0.20240506",
    "types-pyyaml>=6.0.12.20240917",
    "types-setuptools>=75.6.0.20241126",
    "types-ujson>=5.10.0.20240515",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN"]
ignore = ["ANN401"]

[tool.pytest.ini_options]
addopts = ["--strict-markers", "-m", "not integration"]
markers = ["integration: needs a live API server, a worker and Redis"]
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
# Modules or packages to check
files = ["app", "main.py", "worker.py"]

# Exclude .venv or other directories
exclude = [
    ".venv",
    "venv",
    "build",
    "dist"
]

# Enable strict mode
strict = true

# Suppress errors for missing imports
ignore_missing_imports = true

# Allow untyped decorators
allow_untyped_decorators = true

# Disallow untyped function definitions
disallow_untyped_defs = true

# Disallow calling untyped functions
disallow_untyped_calls = true

# Warn about unused "type: ignore" comments
warn_unused_ignores = true

# Enable strict optional checks
strict_optional = true

# Warn about unused imports
warn_unused_configs = true
